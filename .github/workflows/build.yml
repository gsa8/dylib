name: Build ios Dylib

on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Compile dylib
      run: |
        xcrun clang -dynamiclib -arch arm64 -framework UIKit -framework Foundation source.m -o mytweak.dylib
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-dylib
        path: "*.dylib"
